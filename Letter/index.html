<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо в вазе на камине</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
    background: linear-gradient(to bottom, #0f172a, #172554, #0f172a);
    color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .snowflake {
    position: fixed; top: -10vh; color: #fff; z-index: 1;
    user-select: none; pointer-events: none;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: .3; }
  }
  main {
    position: relative; z-index: 10;
    width: 100%; max-width: 512px;
    padding: 48px 24px; text-align: center;
    background: rgba(255,255,255,.1);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(103,232,249,.3);
    border-radius: 24px;
    box-shadow: 0 0 40px rgba(56,189,248,.2);
  }
  h1 {
    margin: 0; font-size: clamp(26px, 7vw, 38px);
    font-weight: 800; letter-spacing: .02em; line-height: 1.25;
    color: #a5f3fc;
  }
</style>
</head>
<body>

<div id="snow" aria-hidden="true"></div>

<main>
  <h1>Письмо в вазе на камине</h1>
</main>

<script>
  var snow = document.getElementById("snow");
  for (var i = 0; i < 35; i++) {
    var f = document.createElement("span");
    f.className = "snowflake";
    f.textContent = "❄";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = (Math.random() * 14 + 10) + "px";
    f.style.animationDuration = (Math.random() * 5 + 6) + "s";
    f.style.animationDelay = (Math.random() * 6) + "s";
    snow.appendChild(f);
  }
</script>
</body>
</html>
