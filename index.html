<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодняя открытка</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://jsdelivr.net/@tailwindcss/browser@4"></script>
    <style>
        @keyframes fall {
            0% { transform: translateY(-10vh); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0.3; }
        }
        .snowflake {
            position: fixed;
            top: -10vh;
            color: white;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 relative font-sans">

    <!-- Контейнер для снежинок -->
    <div id="snow-container"></div>

    <!-- Главная карточка -->
    <main class="max-w-lg w-full bg-white/10 backdrop-blur-md border border-cyan-300/30 rounded-3xl p-6 md:p-8 text-center shadow-[0_0_40px_rgba(56,189,248,0.2)] z-10 my-6">
        
        <div class="text-5xl mb-3">🎅❄️</div>
        
        <h1 class="text-3xl font-extrabold text-cyan-200 mb-2 tracking-wide">
            С Новым Годом!
        </h1>
        
        <p class="text-blue-100/80 text-sm mb-5">
            До наступления самого волшебного праздника осталось:
        </p>

        <!-- Таймер обратного отсчёта -->
        <div class="grid grid-cols-4 gap-2 mb-6">
            <div class="bg-slate-900/60 border border-cyan-400/20 rounded-2xl p-3">
                <div id="days" class="text-2xl md:text-3xl font-black text-cyan-300">00</div>
                <div class="text-xs text-blue-200/70">дней</div>
            </div>
            <div class="bg-slate-900/60 border border-cyan-400/20 rounded-2xl p-3">
                <div id="hours" class="text-2xl md:text-3xl font-black text-cyan-300">00</div>
                <div class="text-xs text-blue-200/70">часов</div>
            </div>
            <div class="bg-slate-900/60 border border-cyan-400/20 rounded-2xl p-3">
                <div id="minutes" class="text-2xl md:text-3xl font-black text-cyan-300">00</div>
                <div class="text-xs text-blue-200/70">минут</div>
            </div>
            <div class="bg-slate-900/60 border border-cyan-400/20 rounded-2xl p-3">
                <div id="seconds" class="text-2xl md:text-3xl font-black text-cyan-300">00</div>
                <div class="text-xs text-blue-200/70">секунд</div>
            </div>
        </div>

        <!-- Кнопка управления музыкой -->
        <button id="musicBtn" onclick="toggleMusic()" class="w-full py-3 px-5 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold text-white shadow-lg transition transform active:scale-95 cursor-pointer flex items-center justify-center gap-2 mb-6">
            <span id="btnIcon">▶️</span>
            <span id="btnText">Включить новогоднюю музыку</span>
        </button>

        <audio id="bgMusic" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>

        <!-- Разделитель -->
        <div class="border-t border-cyan-300/20 my-5"></div>

        <!-- Форма обратной связи для тебя -->
        <h2 class="text-xl font-bold text-cyan-200 mb-3">✉️ Написать мне поздравление</h2>
        
        <form action="https://formsubmit.co" method="POST" class="space-y-3 text-left">
            <!-- Настройки FormSubmit -->
            <input type="hidden" name="_subject" value="Новое сообщение с новогоднего сайта!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div>
                <input type="text" name="От_кого" required placeholder="От кого (твоё имя)" 
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-900/70 border border-cyan-300/30 text-white placeholder-blue-200/50 focus:outline-none focus:border-cyan-400 text-sm">
            </div>

            <div>
                <textarea name="Сообщение" rows="3" required placeholder="Напиши мне поздравление или сообщение..." 
                    class="w-full px-4 py-2.5 rounded-xl bg-slate-900/70 border border-cyan-300/30 text-white placeholder-blue-200/50 focus:outline-none focus:border-cyan-400 text-sm resize-none"></textarea>
            </div>

            <button type="submit" class="w-full py-3 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-bold text-white shadow-lg transition transform active:scale-95 cursor-pointer">
                Отправить мне на почту 🎄
            </button>
        </form>

    </main>

    <script>
        // Управление аудио
        const audio = document.getElementById('bgMusic');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                btnText.textContent = 'Включить новогоднюю музыку';
                btnIcon.textContent = '▶️';
            } else {
                audio.play();
                btnText.textContent = 'Поставить на паузу';
                btnIcon.textContent = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        // Таймер до ближайшего 1 января
        function updateTimer() {
            const now = new Date();
            const nextYear = now.getFullYear() + 1;
            const newYearDate = new Date(`January 1, ${nextYear} 00:00:00`);
            const diff = newYearDate - now;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Генерация снежинок
        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 35; i++) {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.textContent = '❄';
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.fontSize = (Math.random() * 14 + 10) + 'px';
            flake.style.animationDuration = (Math.random() * 5 + 5) + 's';
            flake.style.animationDelay = (Math.random() * 5) + 's';
            snowContainer.appendChild(flake);
        }
    </script>
</body>
</html>
